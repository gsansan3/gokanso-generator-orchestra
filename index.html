<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>ご感想ジェネレータ　～オーケストラ版～</title>
    <meta name="description" content="演奏会のアンケートの自由記述欄に書かれていそうな感想をランダムに生成。回すと、意味の分からない感想が生まれる。">
    <meta name="theme-color" content="#0e0808">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Yomogi&display=swap" rel="stylesheet">
    <!-- ?v= は、ブラウザに古いファイルを使い続けられないための版番号。style.css・app.js・reel-data.js（と fonts/ の中身）を変えたら、4か所とも新しい値にする -->
    <link rel="stylesheet" href="fonts/tekitoupoem.css?v=20260921n">
    <link rel="stylesheet" href="style.css?v=20260921n">
</head>
<body>
    <main class="app">
        <h1 class="title">ご感想ジェネレータ<span class="subtitle">～オーケストラ版～</span></h1>

        <button type="button" id="options-button" class="sound-toggle options-toggle">オプション</button>
        <button type="button" id="sound-toggle" class="sound-toggle" aria-live="polite">音なし</button>

        <section class="reels" aria-label="リール">
            <div class="reel-row"><div class="card"><div class="strip"></div></div></div>
            <div class="reel-row"><div class="card"><div class="strip"></div></div></div>
            <div class="reel-row"><div class="card"><div class="strip"></div></div></div>
        </section>

        <div class="actions">
            <button type="button" id="spin-button" class="button primary">回す</button>
        </div>

        <div class="actions actions-sub">
            <button type="button" id="card-button" class="button secondary" hidden>アンケート用紙を見る</button>
        </div>
    </main>

    <div id="card-modal" class="modal" role="dialog" aria-modal="true" aria-label="アンケート用紙" hidden>
        <div class="modal-panel">
            <img id="card-image" class="card-image" alt="">
            <div class="modal-actions">
                <button type="button" id="card-save" class="button primary">画像を保存</button>
                <button type="button" id="card-share" class="button secondary">Xでシェアする</button>
            </div>
            <button type="button" id="card-close" class="modal-close">閉じる</button>
        </div>
    </div>

    <div id="options-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="options-title" hidden>
        <div class="options-panel">
            <p id="options-title" class="gate-title">オプション</p>
            <fieldset class="option-group" data-option="visits">
                <legend>ご来場回数</legend>
                <div class="option-choices"></div>
            </fieldset>
            <fieldset class="option-group" data-option="age">
                <legend>ご年代</legend>
                <div class="option-choices"></div>
            </fieldset>
            <fieldset class="option-group" data-option="satisfaction">
                <legend>本日の満足度（1＝低い　5＝高い）</legend>
                <div class="option-choices"></div>
            </fieldset>
            <label class="option-group option-name">
                <span>お名前（任意）</span>
                <input type="text" id="option-name" autocomplete="off" placeholder="空欄のままなら、白紙になります">
            </label>

            <div class="options-actions">
                <button type="button" id="options-close" class="button primary">閉じる</button>
            </div>
        </div>
    </div>

    <div id="sound-gate" class="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title" hidden>
        <div class="gate-panel">
            <p id="gate-title" class="gate-title">音を出しますか？</p>
            <div class="gate-buttons">
                <button type="button" class="button primary" data-sound="on">音あり</button>
                <button type="button" class="button secondary" data-sound="off">音なし</button>
            </div>
            <p class="gate-note">あとから右上のボタンで切り替えられます</p>
        </div>
    </div>

    <script src="reel-data.js?v=20260921n"></script>
    <script src="app.js?v=20260921n"></script>
</body>
</html>
